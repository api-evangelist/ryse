aid: ryse
name: RYSE
description: >-
  RYSE (legal name RYSE USA Inc.) is a consumer IoT and smart-home hardware company that retrofits
  existing window coverings with motorization. Its product line — SmartShade, SmartShade + BatteryPack,
  SmartCurtain, SmartBridge and SmartButton — motorizes shades, blinds and curtains a household already
  owns, and pairs them to Amazon Alexa, Google Home and Apple HomeKit through the SmartBridge add-on,
  plus a first-party Homey Pro app. RYSE publishes no traditional developer program: there is no
  developer portal, no OpenAPI, no GitHub organization and no device or cloud API for the shade
  hardware itself. What RYSE does publish, on its own helloryse.com hosts, is a substantial
  agent-commerce surface: an llms.txt and agents.md, a Universal Commerce Protocol (UCP) discovery
  document at /.well-known/ucp, and three live, anonymously-introspectable MCP servers covering
  catalog search, cart, checkout and customer order status.
