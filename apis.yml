- name: RYSE UCP Commerce MCP
  description: >-
    RYSE's Universal Commerce Protocol (UCP) shopping service, exposed over MCP at
    https://www.helloryse.com/api/ucp/mcp. Anonymous tools/list returns 13 tools with full JSON Schema
    input contracts covering catalog search/lookup/product detail, cart lifecycle, and checkout
    lifecycle including a required idempotency-key on complete_checkout. Shopify-native surface,
    scoped to RYSE's own store.
  humanURL: https://www.helloryse.com/agents.md
