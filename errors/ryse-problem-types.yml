  layer: JSON-RPC transport
  shape: '{"jsonrpc":"2.0","id":<id>,"error":{"code":<int>,"message":<string>,"data":<any>}}'
  http_status_observed: [200, 422]
- id: tool-error
  layer: MCP tool result
  shape: '{"jsonrpc":"2.0","id":<id>,"result":{"content":[{"type":"text","text":<string>}],"isError":true}}'
  http_status_observed: [200]
  warning: >-
    Tool failures are HTTP 200 with isError true. Status-code-only error handling will silently
    treat failures as successes.
- id: rest-error
  layer: customer-account HTTP layer
  shape: '{"errors":[{"message":<string>}]}'
  http_status_observed: [401]
