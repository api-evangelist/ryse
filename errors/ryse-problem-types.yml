errors:
- code: -32001
  message: UCP discovery failed
  endpoint: https://www.helloryse.com/api/ucp/mcp
  http_status: 422
  envelope: transport-error
  data:
    code: invalid_profile_url
    content: 'Unable to fetch agent profile: Missing profile uri'
    continue_url: https://helloryse.myshopify.com/
  cause: >-
    The request omitted meta["ucp-agent"].profile, or supplied a URI the server could not
    dereference into a UCP agent profile document.
  remediation: >-
    Publish a fetchable UCP agent profile and pass its URI as meta["ucp-agent"].profile on every
    tools/call, prompts/list and resources/list request.
  retryable: false
  observed: '2026-08-26'
