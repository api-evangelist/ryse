undocumented:
- >-
  429 handling. RYSE's own agents.md instructs agents to "Back off on 429 responses", but no 429 was
  reproduced under normal probing and no Retry-After behaviour is documented. The shape of a
  rate-limit error is unknown.
- >-
  Payment declines. complete_checkout is the only money-moving call and RYSE publishes no decline-code
  reference; the decline vocabulary belongs to the underlying payment handlers (Google Pay,
  Shopify card, Shop Pay) declared in /.well-known/ucp, not to RYSE.
