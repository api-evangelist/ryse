migration_crosswalk:
  reason: >-
    The Storefront MCP at /api/mcp is deprecated with a stated sunset of 2026-08-31 and instructs
    callers to migrate to the UCP tools. These are the replacements.
  rows:
  - {deprecated_tool: search_catalog, surface: storefront, replacement: search_catalog, replacement_surface: ucp, confidence: high, note: 'UCP version adds pagination, filters and signals'}
  - {deprecated_tool: get_product_details, surface: storefront, replacement: get_product, replacement_surface: ucp, confidence: high, note: 'storefront takes product_id + options; UCP takes a catalog object'}
  - {deprecated_tool: get_cart, surface: storefront, replacement: get_cart, replacement_surface: ucp, confidence: high, note: 'storefront takes cart_id; UCP takes {meta, id}'}
  - {deprecated_tool: update_cart, surface: storefront, replacement: update_cart, replacement_surface: ucp, confidence: high, note: 'storefront flattens add_items/update_items/remove_line_ids/buyer_identity/delivery_addresses/discount_codes; UCP nests them under a cart object'}
  - {deprecated_tool: search_shop_policies_and_faqs, surface: storefront, replacement: null, replacement_surface: null, confidence: high, note: 'NO UCP EQUIVALENT — see mcp_only'}
mcp_only:
- tool: search_shop_policies_and_faqs
  surface: storefront
  reason: >-
    Retrieval over RYSE's published store policies and FAQs. No UCP capability covers policy or FAQ
    retrieval and there is no REST or GraphQL equivalent. It is the one capability that disappears
    entirely at the 2026-08-31 sunset with nothing to migrate to — an agent needing RYSE's return or
    shipping terms after that date must fall back to fetching
    https://www.helloryse.com/policies/* as HTML.
  severity: capability-loss
- tool: get_most_recent_order_status
  surface: customer-account
  reason: >-
    Resolves the signed-in customer's latest order with no identifier argument. Has no UCP or REST
    equivalent because it depends on the OAuth session as the implicit selector.
- tool: get_order_status
  surface: customer-account
  reason: >-
    Fetches by human-facing order_number rather than by GID, which the UCP get_order does not
    accept. Customer-scoped; requires customer-account-mcp-api:full.
- tool: get_store_credit_balances
  surface: customer-account
  reason: No UCP capability models store credit. Customer-scoped and OAuth-gated.
- tool: request_return
  surface: customer-account
  reason: >-
    The only post-purchase reversal on the entire surface, and it exists only on the OAuth-gated
    customer server — the UCP commerce surface an agent transacts on has no way to reach it. An
    agent that completes a checkout anonymously cannot undo it without the buyer separately
    authenticating.
  severity: reversal-surface-split
rest_only: []
rest_only_note: RYSE publishes no REST contract, so there are no REST-only operations to record.
