method: derived
source: >-
  Derived by binding every tool returned by anonymous tools/list on RYSE's three MCP endpoints
  (mcp/ryse-ucp-mcp-tools.json, mcp/ryse-storefront-mcp-tools.json,
  mcp/ryse-customer-account-mcp-tools.json, all probed 2026-08-26) to the UCP capability URN and
  published JSON Schema RYSE declares for it in well-known/ryse-ucp.json.
binding_basis: ucp-capability
binding_basis_note: >-
  The normal crosswalk binds MCP tools to OpenAPI operationIds. RYSE publishes NO OpenAPI, on any
  host — see the STEP 0b probe record below. The strongest real binding available is therefore
  tool -> UCP capability URN -> published capability schema, which is a machine-readable contract
  RYSE genuinely declares from its own /.well-known/ucp. A second axis maps the deprecated
  Storefront MCP tools onto their UCP replacements, which is the migration an integrator has to make
  before 2026-08-31. Every row is a tool that was actually returned; nothing is mapped by guess.
