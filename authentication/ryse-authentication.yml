  standard: RFC 9728 OAuth 2.0 Protected Resource Metadata
  document: https://account.helloryse.com/.well-known/oauth-protected-resource
  file: ../well-known/ryse-oauth-protected-resource.json
  resource: https://account.helloryse.com
  authorization_servers:
