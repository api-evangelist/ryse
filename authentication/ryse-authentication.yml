notes:
- >-
  No API key, no client credentials grant, and no machine-to-machine credential is published anywhere
  on RYSE's own surface. An agent cannot obtain a RYSE-issued key.
- >-
  RYSE's robots.txt and agents.md impose an out-of-band authorization rule that no credential
  satisfies: "Checkouts are for humans. Do NOT complete checkout, payment, or order placement
  automatically ... without an explicit, contemporaneous human approval step." Treat human approval
  as a required authorization factor on complete_checkout.
- >-
  The device/hardware side of RYSE (SmartShade, SmartCurtain, SmartBridge) has no published
  authentication surface at all — there is no cloud or local device API documented for developers.
