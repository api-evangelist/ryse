generated: '2026-08-26'
method: probed
source: >-
  https://www.helloryse.com/.well-known/ucp,
  https://account.helloryse.com/.well-known/oauth-authorization-server,
  https://account.helloryse.com/.well-known/oauth-protected-resource,
  https://www.helloryse.com/.well-known/openid-configuration, and live JSON-RPC probes of RYSE's
